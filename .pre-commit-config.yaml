# Pre-commit hooks for toby.
#
# One-time setup (uv is already installed on this machine):
#   uv tool install pre-commit
#   pre-commit install
#
# The formatting hooks below download their own pinned binaries, so you do NOT
# need system clang-format or gersemi installations for formatting to work.
#
# clang-tidy is intentionally NOT a pre-commit hook: it needs a compile database
# and a full build, which is too slow for every commit. Run it via the
# `clang-tidy` CMake preset or in CI instead.

minimum_pre_commit_version: "3.5.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^tests/fixtures/hf/malformed\.json$
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-merge-conflict

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        types_or: [c++, c]

  - repo: https://github.com/BlankSpruce/gersemi-pre-commit
    rev: 0.27.7
    hooks:
      - id: gersemi
