name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debug and static analysis
            preset: clang-debug
            analyze: true
          - name: ASan and UBSan
            preset: clang-asan
            analyze: false
          - name: TSan
            preset: clang-tsan
            analyze: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Clang 20 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes ca-certificates gnupg wget

          wget --quiet https://apt.llvm.org/llvm-snapshot.gpg.key
          LLVM_KEY_FINGERPRINT="$(
            gpg --show-keys --with-colons llvm-snapshot.gpg.key |
              awk -F: '$1 == "fpr" { print $10; exit }'
          )"
          test "${LLVM_KEY_FINGERPRINT}" = "6084F3CF814B57C1CF12EFD515CF4D18AF4F7421"
          sudo install -D -m 0644 \
            llvm-snapshot.gpg.key \
            /etc/apt/keyrings/apt.llvm.org.asc
          echo \
            "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-20 main" |
            sudo tee /etc/apt/sources.list.d/apt.llvm.org.list >/dev/null
          rm llvm-snapshot.gpg.key

          sudo apt-get update
          sudo apt-get install --yes \
            clang-20 \
            clang-tidy-20 \
            libc++-20-dev \
            libc++abi-20-dev \
            libicu-dev \
            lld-20 \
            cmake \
            ninja-build

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: false

      - name: Cache shared dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_shared
          key: ${{ runner.os }}-shared-deps-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: |
            ${{ runner.os }}-shared-deps-

      - name: Build and test (${{ matrix.name }})
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }}
          ctest --preset ${{ matrix.preset }}

      - name: Static analysis (clang-tidy)
        if: matrix.analyze
        run: |
          cmake --preset clang-tidy
          cmake --build --preset clang-tidy
